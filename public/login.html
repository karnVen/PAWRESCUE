<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawRescue – Login / Register</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; /* Lighter bg */ }
    .login-card { background-color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border-radius: 0.75rem; /* Slightly larger radius */ }
    input { background-color: #f3f4f6; border: 1px solid #d1d5db; color: #111827; width: 100%; padding: 0.75rem; border-radius: 0.5rem; }
    input:focus { outline: none; border-color: #4F46E5; ring: 1px; ring-color: #4F46E5; }
    button { border-radius: 0.5rem; font-weight: 600; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; padding: 0.75rem; width: 100%; }
    .btn-primary { background-color: #4F46E5; color: white; border: 1px solid transparent; }
    .btn-primary:hover { background-color: #4338ca; }
    .btn-secondary { background-color: white; color: #4F46E5; border: 1px solid #4F46E5; }
    .btn-secondary:hover { background-color: #eef2ff; } /* Light purple background on hover */
    .btn-google { background-color: white; color: #374151; border: 1px solid #d1d5db; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-google:hover { background-color: #f9fafb; }
    a { color: #4F46E5; }
    a:hover { text-decoration: underline; }
    ::placeholder { color: #9ca3af; }
    .divider { text-align: center; margin: 1.5rem 0; border-bottom: 1px solid #e5e7eb; line-height: 0.1em; }
    .divider span { background: #fff; padding: 0 10px; color: #6b7280; font-size: 0.875rem; font-weight: 500; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 bg-gray-50">
  <div class="login-card p-8 w-full max-w-sm"> <!-- Adjusted max-width -->
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-2">Welcome Back!</h2>
    <p class="text-sm text-gray-500 text-center mb-6">Log in or register to continue.</p>

    <div class="space-y-4">



      <!-- *** Ensure ID is 'googleloginbtn' *** -->
      <button type="button" id="googleloginbtn" class="btn-google">
        <svg class="w-5 h-5" aria-hidden="true" focusable="false" data-prefix="fab" data-icon="google" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512"><path fill="currentColor" d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 21.5 173.5 58.5l-66.6 66.6C309.5 99.8 280.7 86 248 86c-84.3 0-152.3 68.5-152.3 153.4s68 153.4 152.3 153.4c90.9 0 138.3-60.6 142.8-92.4H248v-73.9h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path></svg>
        Continue with Google
      </button>

      <p class="text-center text-xs mt-6 text-gray-500">
        <!-- Optional: Link back if needed -->
        <a href="index.html" class="font-medium hover:underline" id="backbtn">Cancel and return home</a>
        <p id="msg"></p>
      </p>
    </div>
  </div>

  <!-- Firebase and Login Logic Script -->
  <!-- *** Ensure login.js is linked correctly *** -->
  <script src="login.js" type="module"></script>
</body>
</html>
